name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck Worker
        run: npm run typecheck:worker

      - name: Build Angular
        run: npm run build

      - name: Unit tests
        run: npx ng test --watch=false --browsers=ChromeHeadlessNoSandbox

      - name: Worker bundle (dry run)
        run: npx wrangler deploy --dry-run --outdir dist/worker
